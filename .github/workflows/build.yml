name: Build NSURLSession Test App
on:
  workflow_dispatch:
  push:
    paths:
      - main.m
      - build.sh
      - packaging/**
      - README_zh.md
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install signing and packaging tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ldid dpkg
      - name: Compile, sign and package rootless App
        run: bash build.sh
      - name: Upload installable deb
        uses: actions/upload-artifact@v4
        with:
          name: vhx-session-test-rootless
          path: dist/
          if-no-files-found: error
          retention-days: 14
